<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naga City Flood Monitoring</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<button id="hamburger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
<div id="map-container">
    <div id="map"></div>
</div>
<div id="left-menu" class="menu-hidden">
    <div class="menu-header">
        <h3>Naga Flood Monitor</h3>
        <button onclick="toggleMenu()" class="close-menu">×</button>
    </div>
    <div class="menu-search">
        <input id="map-search-input" type="text" placeholder="Search in Naga...">
        <button onclick="searchLocation()"><i class="fa-solid fa-search"></i></button>
    </div>
    <div class="menu-section">
        <h4><i class="fa-solid fa-filter"></i> Filter by Status</h4>
        <div class="status-filter-buttons">
            <button class="filter-btn active" data-status="all">All</button>
            <button class="filter-btn" data-status="green">Green</button>
            <button class="filter-btn" data-status="yellow">Yellow</button>
            <button class="filter-btn" data-status="red">Red</button>
        </div>
    </div>
    <div class="menu-section">
        <h4><i class="fa-solid fa-list"></i> Barangays (1-27) <span onclick="toggleBarangayList()">▼</span></h4>
        <ul id="barangay-list"></ul>
    </div>
    <div class="menu-section">
        <h4><i class="fa-solid fa-circle-info"></i> Flood Alert Legend</h4>
        <div class="legend">
            <div class="legend-item"><span class="legend-color green"></span> Green: Safe</div>
            <div class="legend-item"><span class="legend-color yellow"></span> Yellow: Prepare</div>
            <div class="legend-item"><span class="legend-color red"></span> Red: Critical - Evacuate</div>
        </div>
    </div>
    <div class="menu-section">
        <h4><i class="fa-solid fa-map-marked-alt"></i> Map Features Legend</h4>
        <div class="legend">
            <div class="legend-item"><span class="legend-color" style="background: #1E90FF;"></span> Waterways: Naga River</div>
            <div class="legend-item"><span class="legend-color" style="background: #A9A9A9;"></span> Hillshade: Terrain</div>
            <div class="legend-item"><span class="legend-color" style="background: #8B4513;"></span> Contours: Elevation</div>
        </div>
    </div>
    <div class="menu-section">
        <h4><i class="fa-solid fa-map"></i> Basemap</h4>
        <div class="basemap-controls">
            <button onclick="setBasemap('outdoors')">Outdoors</button>
            <button onclick="setBasemap('streets')">Streets</button>
            <button onclick="setBasemap('satellite')">Satellite</button>
        </div>
    </div>
</div>
<div id="flood-sidebar" class="sidebar-hidden">
    <div class="sidebar-header">
        <h2 id="sidebar-title">Details</h2>
        <button onclick="closeFloodSidebar()" class="close-btn">×</button>
    </div>
    <div id="sidebar-content"></div>
</div>
<div id="toast" class="toast" style="display: none;"></div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
