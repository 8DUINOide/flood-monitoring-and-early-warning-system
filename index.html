<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naga City Flood Monitoring</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Top-left hamburger -->
<button id="hamburger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>

<!-- Full-screen map -->
<div id="map-container">
    <div id="map"></div>
</div>

<!-- Left slide-in menu -->
<div id="left-menu" class="menu-hidden">
    <div class="menu-header">
        <h3>Naga Flood Simulator</h3>
        <button onclick="toggleMenu()" class="close-menu">&times;</button>
    </div>
    <div class="menu-search">
        <input id="map-search-input" type="text" placeholder="Search in Naga...">
        <button onclick="searchLocation()"><i class="fa-solid fa-search"></i></button>
    </div>
    <div class="menu-section">
        <h4><i class="fa-solid fa-list"></i> Barangays (1-27) <span onclick="toggleBarangayList()">&#9660;</span></h4>
        <ul id="barangay-list"></ul>
    </div>
    <div class="menu-section">
        <h4><i class="fa-solid fa-circle-info"></i> Flood Alert Legend</h4>
        <div class="legend">
            <div class="legend-item"><span class="legend-color green"></span> Green: Safe - Continue monitoring</div>
            <div class="legend-item"><span class="legend-color yellow"></span> Yellow: Prepare - Secure belongings & be ready</div>
            <div class="legend-item"><span class="legend-color red"></span> Red: Critical - Evacuate immediately</div>
        </div>
    </div>
    <div class="menu-section">
        <h4><i class="fa-solid fa-play-circle"></i> Simulation Controls</h4>
        <div class="sim-controls">
            <button onclick="startSimulation()" id="start-btn">Start Simulation</button>
            <button onclick="pauseSimulation()" id="pause-btn" disabled>Pause</button>
            <button onclick="resetSimulation()" id="reset-btn" disabled>Reset</button>
            <div class="speed-control">
                <label>Speed: </label>
                <input type="range" id="sim-speed" min="1" max="10" value="5" disabled>
            </div>
        </div>
    </div>
</div>

<!-- Right details sidebar -->
<div id="flood-sidebar" class="sidebar-hidden">
    <div class="sidebar-header">
        <h2 id="sidebar-title">Details</h2>
        <button onclick="closeFloodSidebar()" class="close-btn">&times;</button>
    </div>
    <div id="sidebar-content"></div>
</div>

<div id="toast" class="toast" style="display: none;"></div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
